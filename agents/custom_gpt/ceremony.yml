components:
  schemas:
    CreateCommentRequest:
      title: CreateCommentRequest
      type: object
      properties:
        projectId:
          type: string
          description: The id of the project to attach the comment to.
        objectType:
          type: string
          description: The type of the object to attach the comment to (trace, observation, session, prompt).
        objectId:
          type: string
          description:
            The id of the object to attach the comment to. If this does not reference a valid existing object, an error
            will be thrown.
        content:
          type: string
          description: The content of the comment. May include markdown. Currently limited to 3000 characters.
        authorUserId:
          type: string
          nullable: true
          description: The id of the user who created the comment.
      required:
        - projectId
        - objectType
        - objectId
        - content
    CreateCommentResponse:
      title: CreateCommentResponse
      type: object
      properties:
        id:
          type: string
          description: The id of the created object in Langfuse
      required:
        - id
    GetCommentsResponse:
